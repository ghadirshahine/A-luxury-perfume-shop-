<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0; url=https://xvmhw7dr.sanity.studio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sanity Studio | دار الأُمراء</title>
    <style>
      :root {
        --bg: #0b0b0b;
        --panel: #141414;
        --text: #f4eedf;
        --muted: #b7a98c;
        --gold: #d9b87d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a120e 0%, var(--bg) 42%);
        color: var(--text);
        font-family: Tahoma, Arial, sans-serif;
      }
      .card {
        width: min(92vw, 420px);
        background: rgba(20, 20, 20, 0.92);
        border: 1px solid rgba(217,184,125,0.35);
        border-radius: 18px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }
      p { margin: 0 0 16px; color: var(--muted); }
      a {
        display: inline-block;
        background: linear-gradient(135deg, #d9b87d, #f3d7a1);
        color: #121212;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p>يتم توجيهك إلى Sanity Studio…</p>
      <p>الوصول مقيد بأدوار Sanity: فقط admin والأشخاص المسموح لهم يمكنهم الدخول.</p>
      <a href="https://xvmhw7dr.sanity.studio">فتح Sanity Studio</a>
    </main>
  </body>
</html>
