<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>سلة التسوق | دار الأُمراء</title>
  <meta name="description" content="راجع سلة تسوقك في دار الأُمراء: عدّل الكميات، فعّل كود الخصم، أضف التغليف الفاخر ورسالة الإهداء، وتابع الشحن المجاني — ثم أتمم طلبك بأمان.">
  <meta name="theme-color" content="#0B0B0B">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://dar-alumara.example.com/cart.html">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="دار الأُمراء">
  <meta property="og:title" content="سلة التسوق — دار الأُمراء">
  <meta property="og:description" content="راجع اختياراتك وطبّق كود الخصم قبل إتمام الطلب.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:locale" content="ar_SY">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "الرئيسية", "item": "https://dar-alumara.example.com/" },
      { "@type": "ListItem", "position": 2, "name": "سلة التسوق", "item": "https://dar-alumara.example.com/cart.html" }
    ]
  }
  </script>
</head>
<body data-page="cart">
  <main id="main">

    <div class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="مسار التصفح">
          <a href="index.html">الرئيسية</a>
          <span class="sep"><svg class="ic"><use href="#i-chevron-left"/></svg></span>
          <span aria-current="page">سلة التسوق</span>
        </nav>
        <h1>سلة التسوق</h1>
        <p class="ph-sub" id="cartSub">راجع اختياراتك، طبّق كود الخصم، وأضف لمسة الإهداء قبل إتمام الطلب.</p>
      </div>
    </div>

    <section class="section tight">
      <div class="container">
        <div id="cartPage" aria-busy="true">
          <div class="cart-layout">
            <div class="cart-main">
              <div class="sk-box sk-btn" style="max-width:340px"></div>
              <div class="panel-card">
                <div class="sk-line w30"></div>
                <div class="sk-line w80"></div>
                <div class="sk-line w60"></div>
                <div class="sk-line w80"></div>
              </div>
            </div>
            <aside class="cart-aside">
              <div class="panel-card">
                <div class="sk-line w40"></div>
                <div class="sk-line w80"></div>
                <div class="sk-line w60"></div>
                <div class="sk-box sk-btn"></div>
              </div>
            </aside>
          </div>
        </div>
      </div>
    </section>

    <!-- قد يعجبك أيضًا -->
    <section class="section band" id="cartReco" hidden>
      <div class="container">
        <div class="section-head">
          <div><h2>قد يعجبك أيضًا</h2><p class="sh-sub">مختارات تكمّل رحلتك العطرية</p></div>
          <a class="sec-link" href="shop.html">تصفّح المتجر <svg class="ic"><use href="#i-chevron-left"/></svg></a>
        </div>
        <div class="rail-wrap reveal">
          <button class="rail-btn next" type="button" data-rail="railCartRec" data-dir="next" aria-label="التالي"><svg class="ic"><use href="#i-chevron-left"/></svg></button>
          <button class="rail-btn prev" type="button" data-rail="railCartRec" data-dir="prev" aria-label="السابق"><svg class="ic"><use href="#i-chevron-right"/></svg></button>
          <div class="rail" id="railCartRec"></div>
        </div>
      </div>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
